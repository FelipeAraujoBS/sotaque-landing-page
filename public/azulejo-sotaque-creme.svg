    x="100"
    y="100"
    width="800"
    height="800"
    rx="20"
    stroke="#6E1016"
    stroke-width="4.5"
    stroke-dasharray="14 14"
    stroke-opacity="0.75"
  />

  <!-- Cantoneiras ornamentais nos 4 vértices do azulejo -->
  <circle cx="100" cy="100" r="12" fill="#E27908" />
  <circle cx="900" cy="100" r="12" fill="#E27908" />
  <circle cx="100" cy="900" r="12" fill="#E27908" />
  <circle cx="900" cy="900" r="12" fill="#E27908" />

