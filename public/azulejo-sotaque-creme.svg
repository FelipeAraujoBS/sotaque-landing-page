  <title>Azulejo Sotaque · Creme e Azul Meia-Noite</title>
  <defs>
    <!-- Brilho e bisel esmaltado sutil característico do azulejo cerâmico -->
    <linearGradient id="ceramicGlaze-creme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Sombra suave para o símbolo central -->
    <filter id="logoShadow-creme" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

