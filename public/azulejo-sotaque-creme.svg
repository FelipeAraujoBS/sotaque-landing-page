    x="35"
    y="35"
    width="930"
    height="930"
    rx="74"
    fill="#F4F1E5"
  />

  <!-- 2 · Moldura de azulejaria tradicional -->
  <!-- Filete externo contínuo -->
  <rect
    x="68"
    y="68"
    width="864"
    height="864"
    rx="32"
    stroke="#E27908"
    stroke-width="8"
  />

  <!-- Filete interno pontilhado -->
